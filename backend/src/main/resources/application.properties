spring.datasource.url=jdbc:postgresql://localhost:5432/knowledge_gap
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration for protected APIs
app.jwt.secret=${JWT_SECRET:dev-secret-key-change-me-knowledge-gap-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Configure these environment variables before enabling real email delivery.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# JWT configuration. Change JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:KnowledgeGapJwtSecretKeyChangeThisInProduction123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
