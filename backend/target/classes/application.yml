server:
  port: 8080

spring:
  application:
    name: knowledge-gap-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/okgip_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  cache:
    type: simple

  mail:
    host: smtp.gmail.com
    port: 587
    username: tharun7632@gmail.com
    password: kuzzscajfmzptrhx
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  email:
    enabled: true
  jwt:
    # A 256-bit key base64-encoded
